name: "CodeQL"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["cpp"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo sed -i 's|security.ubuntu.com|azure.archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for i in 1 2 3; do
            sudo apt-get $APT_OPTS update -y && break || sleep 3
          done
          PKGS="g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev ninja-build"
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS install -y --no-install-recommends $PKGS || {
            sudo apt-get $APT_OPTS update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS install -y --fix-missing $PKGS
          }

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/config/codeql-config.yml

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=resources/cmake/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_INJECTOR=ON
          cmake --build build -j"$(nproc)"

      # Perform CodeQL analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{matrix.language}}"
          output: results

      - name: Render CodeQL Findings in Summary
        if: always()
        run: |
          python3 -c "
          import json, glob, os

          sarif_files = glob.glob('results/*.sarif')
          if not sarif_files:
              print('[+] No SARIF files found.')
              exit(0)

          summary_lines = []
          summary_lines.append('### CodeQL Analysis Report\n')

          total_issues = 0
          for sf in sarif_files:
              with open(sf) as f:
                  data = json.load(f)
              for run in data.get('runs', []):
                  results = run.get('results', [])
                  total_issues += len(results)
                  if not results:
                      summary_lines.append('✅ **0 security vulnerabilities or code defects detected.**')
                  else:
                      summary_lines.append(f'⚠️ **Found {len(results)} potential issue(s):**\n')
                      summary_lines.append('| Severity | Rule ID | Description | Location |')
                      summary_lines.append('|---|---|---|---|')
                      for r in results[:20]:
                          rule_id = r.get('ruleId', 'N/A')
                          level = r.get('level', 'warning')
                          msg = r.get('message', {}).get('text', '').replace('\n', ' ')[:80]
                          locs = r.get('locations', [])
                          loc_str = 'N/A'
                          if locs:
                              phys = locs[0].get('physicalLocation', {})
                              uri = phys.get('artifactLocation', {}).get('uri', '')
                              line = phys.get('region', {}).get('startLine', 0)
                              loc_str = f'{uri}:{line}'
                          summary_lines.append(f'| {level} | \`{rule_id}\` | {msg} | \`{loc_str}\` |')

          summary_text = '\n'.join(summary_lines)
          print(summary_text)

          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a') as f:
                  f.write(summary_text + '\n\n')
          "
